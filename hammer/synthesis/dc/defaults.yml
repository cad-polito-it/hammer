# Default settings for synthesis in DC, for project/technology configuration and overriding.
synthesis.dc:
  # Location of the DC binary.
  dc_bin: "${synopsys.synopsys_home}/${synthesis.dc.version}/bin/dc_shell"
  dc_bin_meta: lazysubst # we want later overrides to be able to affect dc_bin

  # DC version to use.
  version: "O-2018.06-SP4"

  # compile or compile/compile_ultra arguments.
  # TODO: remove this and generate this in the Python plugin?
  compile_args: []

  # retiming arguments
  retiming_args: [
    '-justification_effort', 'high', # low | medium | high
    '-minimum_period_only',
    '-sync_transform', 'decompose'
  ]
  # DfT Insertion
  dft_insertion : false

  # Scan configuration 
  insert_dft.scan : true 
  dft.scan.style : "multiplexed_flip_flop" 
  dft.scan.chain_count : 1
  # BSD and JTAG
  insert_dft.bsd : false # TODO implement boundary scan insertion during the synthesis 
  dft.jtag.clk : "jtag_TCK"
  dft.jtag.tdi : "jtag_TDI"
  dft.jtag.tdo : "jtag_TDO"
  dft.jtag.tms : "jtag_TMS"
  dft.jtag.reset : "jtag_reset"
  # Memory Collar configuration 
  dft.memory_wrapper : true 
  dft.memory_wrapper.safe_state : 1
  # Scan compression configuration
  insert_dft.scan_compression : false # TODO implement scan compression insertion during the synthesis 

# Spyglass is used during DfT insertion, for inserting scan test points around memory collars
synthesis.spyglass:
  # Location of the Spyglass binary
  spyglass_bin: "${synopsys.synopsys_home}/${synthesis.spyglass.version}/bin/spyglass"
  spyglass_bin_meta: lazysubst # we want later overrides to be able to affect dc_bin

  # Spyglass version to use.
  version: "O-2018.06-SP4"


# Common synopsys settings.
# TODO: move these to a shared file between ICC and DC.
synopsys:
  # Folder where Synopsys reference methodologies have been extracted.
  # It should contain files in the format of DC-RM_$(DC_VERSION).tar.
  rm_dir: ""

  # Directory where synopsys tools are installed. Contains subfolders like dc, icc, etc.
  synopsys_home: ""

  # License server information, to be overridden by some project generator.
  # e.g. "port_a@server:port_b@server"
  MGLS_LICENSE_FILE: ""
  SNPSLMD_LICENSE_FILE: ""

vlsi.inputs:
  # Do not ungroup these modules/instances
  no_ungroup: []
  # List of retimed modules
  retimed_modules: []
